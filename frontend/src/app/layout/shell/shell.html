<div class="app">
  <header class="bar">
    <div class="bar-in">
      <a class="logo" [routerLink]="auth.homePath()" aria-label="SignSpell home"><app-wordmark size="sm" /></a>

      <!-- the main links: a soft pill glides to the page you are on -->
      <nav class="nav" aria-label="Main" appSlider>
        @for (n of items(); track n.path) {
          <a [routerLink]="n.path" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: !!n.exact }" #rla="routerLinkActive" [attr.aria-current]="rla.isActive ? 'page' : null">{{ n.label }}</a>
        }
      </nav>

      <div class="right">
        <!-- always shows which role is signed in, so it is clear which tools this screen offers -->
        <span class="role" [class.super]="auth.role() === 'super_admin'">{{ roleLabel() }}</span>
        <app-theme-toggle />
        <div class="account">
          <button class="who" type="button" (click)="menu.set(!menu())" [attr.aria-expanded]="menu()" aria-haspopup="menu" aria-label="Account menu">
            <span class="avatar">@if (auth.account()?.info?.profilePhotoUrl; as src) { <img [src]="src" alt=""> } @else { {{ initials() }} }</span>
          </button>
          @if (menu()) {
            <div class="menu" role="menu">
              <div class="me">
                <span class="avatar big">@if (auth.account()?.info?.profilePhotoUrl; as src) { <img [src]="src" alt=""> } @else { {{ initials() }} }</span>
                <div><strong>{{ name() }}</strong><span class="muted small">{{ roleLabel() }} · {{ auth.account()?.username }}</span></div>
              </div>
              <a role="menuitem" [routerLink]="auth.homePath() + '/profile'" (click)="menu.set(false)">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path [attr.d]="icons['user']" /></svg>
                Profile
              </a>
              <button role="menuitem" type="button" (click)="auth.logout()">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path [attr.d]="icons['out']" /></svg>
                Log out
              </button>
            </div>
          }
        </div>
      </div>
    </div>
  </header>

  <main class="main"><router-outlet /></main>

  <!-- phones: the same links as a tab bar at the bottom, where a thumb can reach -->
  <nav class="tabs" aria-label="Main" appSlider>
    @for (n of items(); track n.path) {
      <a [routerLink]="n.path" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: !!n.exact }">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path [attr.d]="icons[n.icon]" /></svg>
        <span>{{ n.label }}</span>
      </a>
    }
  </nav>
</div>
